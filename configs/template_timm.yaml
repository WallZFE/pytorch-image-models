################################################################################
# timm train.py 训练模板（适合长期维护）
#
# 使用方法：
#
# 单卡：
# python train.py -c configs/xxx.yaml
#
# 多卡：
# CUDA_VISIBLE_DEVICES=1 torchrun --nproc_per_node=1 train.py -c configs/xxx.yaml
#
# 下载预训练模型镜像：
# export HF_ENDPOINT=https://hf-mirror.com
# 
################################################################################



################################################################################
#
# 第一部分：最常用参数（日常调整）
#
################################################################################



###############################################################################
# 数据集配置
###############################################################################

# 数据集路径
#
# 说明：ImageNet 或自定义数据集的根目录路径
#
# 格式：ImageFolder
# train/
#     class1/
#     class2/
# val/
#     class1/
#     class2/
#
# 示例：
# data_dir: /data/imagenet
# data_dir: /home/user/datasets/cifar10
#
data_dir: ""



# 数据集类型
#
# 说明：指定数据集类型和名称
# 留空时自动使用 ImageFolder 格式
#
# 常见值：
# ""                    -> ImageFolder（推荐）
# "torchvision/cifar10" -> CIFAR-10
# "torchvision/cifar100"-> CIFAR-100
# "hfds/imagenet-1k"    -> HuggingFace ImageNet
#
# 示例：
# dataset: ""
# dataset: "torchvision/cifar10"
#
dataset: ""



# 训练集名称
#
# 说明：训练数据所在的子文件夹名称
#
# 常见值：
# "train"       -> 标准 ImageFolder
#
# 示例：
# train_split: "train"
#
train_split: "train"



# 验证集名称
#
# 说明：验证数据所在的子文件夹名称
# 注意：不同数据集命名可能不同
#
# 常见值：
# "validation"  -> ImageNet 标准
# "val"         -> 某些数据集
#
# 示例：
# val_split: "validation"
# val_split: "val"
#
val_split: "validation"



###############################################################################
# 模型配置
###############################################################################

# 模型名称
#
# 说明：要训练的模型架构
# 使用 timm.list_models() 查看全部可用模型
#
# CNN 推荐：
# resnet50, resnet101, efficientnet_b0, efficientnet_b4, convnext_base
#
# ViT 推荐：
# vit_base_patch16_224, vit_large_patch16_224, vit_base_patch32_224
#
# 示例：
# model: "resnet50"
# model: "vit_base_patch16_224"
# model: "convnext_base"
#
model: "resnet50"



# 使用预训练权重
#
# 说明：是否从 ImageNet 预训练开始训练
# 强烈建议除非做完全从零训练的研究
#
# true  -> 使用预训练权重（推荐）
# false -> 随机初始化
#
# 示例：
# pretrained: true
# pretrained: false
#
pretrained: true



# 初始化 Checkpoint
#
# 说明：从某个 checkpoint 初始化模型权重
# 不会恢复优化器状态
#
# ""（空） -> 不使用
# 某个 .pth 路径 -> 加载
#
# 示例：
# initial_checkpoint: ""
#
initial_checkpoint: ""



# 分类类别数
#
# 说明：数据集的类别数
# null 时自动从数据集推断（推荐）
#
# 常见值：
# null     -> 自动推断（推荐）
# 10       -> CIFAR-10
# 100      -> CIFAR-100
# 1000     -> ImageNet-1k
#
# 示例：
# num_classes: null
# num_classes: 10
#
num_classes: null



# 输入图像尺寸
#
# 说明：训练时输入图像的高宽尺寸
#
# 常见值：
# ResNet: 224
# ViT: 224, 384（更大更好，显存消耗多）
# EfficientNet: 224, 256, 512
#
# 示例：
# img_size: 224
# img_size: 384
#
img_size: 224



###############################################################################
# 训练超参数（最重要）
###############################################################################

# 批量大小（Batch Size）
#
# 说明：每次迭代处理的样本数
#
# 越大：
# - 显存消耗越多
# - 梯度更稳定，精度可能更高
# - 收敛更快但可能陷入局部最优
#
# 常见值：
# 32   -> 显存紧张
# 64   -> 较小模型
# 128  -> 标准配置（推荐）
# 256  -> 充足显存
# 512+ -> RTX4090 或多卡
#
# 示例：
# batch_size: 128
# batch_size: 256
#
batch_size: 128



# 训练轮数（Epochs）
#
# 说明：训练数据集过多少遍
#
# 常见值：
# 50-100   -> 小数据集（CIFAR-10）
# 300      -> ImageNet 标准
# 100-200  -> 中等数据集
#
# 示例：
# epochs: 300
# epochs: 100
#
epochs: 300



# 优化器选择
#
# 说明：梯度更新算法
#
# CNN 推荐：
# "sgd"   -> SGD with momentum（传统但有效，默认）
# "adamw" -> AdamW（需要调参但容易得分高）
#
# ViT 推荐：
# "adamw"  -> AdamW（ViT 标准）
# "sgd"    -> SGD（也可以但需要调参）
#
# 示例：
# opt: "sgd"
# opt: "adamw"
#
opt: "sgd"



# 学习率（Learning Rate）
#
# 说明：优化器的学习率
# null 时，timm 自动根据 batch_size 计算（推荐）
#
# 手动设置（不推荐，除非知道数据集的最佳 LR）：
#
# SGD 推荐：
# 0.1      -> batch_size=256
# 0.01     -> batch_size=32
#
# AdamW 推荐：
# 1e-3     -> 0.001（标准值）
# 5e-4     -> 更小的值
#
# 示例：
# lr: null         # 让 timm 自动计算（推荐）
# lr: 0.1          # SGD 手动设置
# lr: 1e-3         # AdamW 手动设置
#
lr: null



# Weight Decay（权重衰减）
#
# 说明：L2 正则化强度，防止过拟合
#
# CNN 推荐：
# 1e-4 ~ 2e-5（标准）
#
# ViT 推荐：
# 0.05（较大）
#
# 示例：
# weight_decay: 2e-5     # CNN
# weight_decay: 0.05     # ViT
#
weight_decay: 2e-5



# Momentum（动量）
#
# 说明：SGD 优化器的动量参数
# AdamW 不使用此参数
#
# 常见值：
# 0.9 -> 标准值（推荐）
# 0.95 -> 更强的动量
#
# 示例：
# momentum: 0.9
#
momentum: 0.9



###############################################################################
# 学习率调度器（Learning Rate Scheduler）
###############################################################################

# 学习率调度策略
#
# 说明：训练过程中如何调整学习率
#
# 常见值：
# "cosine"   -> 余弦退火（最推荐，收敛好）
# "step"     -> 阶跃下降
# "multistep"-> 多阶跃（需指定 decay_milestones）
# "plateau"  -> 平台算法（根据验证集精度）
#
# 示例：
# sched: "cosine"
# sched: "step"
#
sched: "cosine"



# 预热轮数（Warmup Epochs）
#
# 说明：训练初期逐渐增加学习率，帮助稳定训练
# 尤其对 ViT 和 Transformer 非常重要
#
# CNN 推荐：
# 5 ~ 10
#
# ViT 推荐：
# 20 ~ 40
#
# 示例：
# warmup_epochs: 5      # CNN
# warmup_epochs: 20     # ViT
#
warmup_epochs: 5



# 预热初始学习率
#
# 说明：warmup 阶段的起始学习率
#
# 通常很小的值，不用改
#
# 示例：
# warmup_lr: 1e-5
#
warmup_lr: 1e-5



# 最小学习率
#
# 说明：学习率下降的下界
# cosine scheduler 会衰减到这个值
#
# 通常设为很小的值
#
# 示例：
# min_lr: 1e-6
#
min_lr: 1e-6



###############################################################################
# 数据增强（非常重要，能显著提高精度）
###############################################################################

# 是否关闭所有增强
#
# 说明：调试 Bug 或验证数据正确性时使用
#
# false -> 启用增强（正常训练）
# true  -> 禁用增强（仅调试用）
#
# 示例：
# no_aug: false
#
no_aug: false



# 自动增强（AutoAugment）
#
# 说明：自动搜索最优的增强策略
#
# null   -> 不用（可以先这样）
# "rand-m9-mstd0.5-inc1" -> ImageNet 推荐
#
# 示例：
# aa: null
# aa: "rand-m9-mstd0.5-inc1"
#
aa: null



# Mixup 强度
#
# 说明：混合输入图像和标签的强度
# 随机混合两张图片，标签也相应混合
#
# 常见值：
# 0.0  -> 不用
# 0.2  -> 小数据集（CIFAR-10）
# 0.8  -> ImageNet 标准（推荐）
#
# 示例：
# mixup: 0.0
# mixup: 0.8
#
mixup: 0.0



# CutMix 强度
#
# 说明：随机剪切并混合图像的不同区域
# 比 Mixup 更激进的增强
#
# 常见值：
# 0.0  -> 不用
# 0.5  -> 温和
# 1.0  -> ImageNet 标准（推荐）
#
# 示例：
# cutmix: 0.0
# cutmix: 1.0
#
cutmix: 0.0



# Label Smoothing
#
# 说明：使硬标签变为软标签，防止过拟合
#
# 常见值：
# 0.0  -> 不用
# 0.1  -> 标准值（推荐）
# 0.2  -> 更强的正则化
#
# 示例：
# smoothing: 0.1
#
smoothing: 0.1



# Random Erasing（随机擦除）
#
# 说明：随机删除图像的一部分，增强鲁棒性
#
# 常见值：
# 0.0   -> 不用
# 0.25  -> ImageNet 推荐（推荐）
#
# 示例：
# reprob: 0.0
# reprob: 0.25
#
reprob: 0.0



###############################################################################
# Dropout 和正则化
###############################################################################

# Dropout（丢弃）
#
# 说明：FC层的 Dropout 比例
#
# 常见值：
# 0.0   -> 不用（通常不需要）
# 0.2   -> 小模型防过拟合
# 0.5   -> 强正则化
#
# 示例：
# drop: 0.0
#
drop: 0.0



# Drop Path（随机深度）
#
# 说明：Transformer 常用，随机跳过某些层
#
# CNN 通常不用（null）
# ViT 推荐：
# 0.1 ~ 0.3
#
# 示例：
# drop_path: null
# drop_path: 0.2
#
drop_path: null



###############################################################################
# 混合精度训练（AMP）- 强烈推荐
###############################################################################

# 启用自动混合精度（AMP）
#
# 说明：使用 float16 加速训练
#
# 好处：
# - 显存减半
# - 训练速度快 2 倍
# - 精度不下降
#
# true  -> 启用（强烈推荐）
# false -> 不用（仅在有问题时禁用）
#
# 示例：
# amp: true
#
amp: true



# AMP 数据类型
#
# 说明：混合精度使用的低精度类型
#
# "float16"  -> 标准，兼容性好
# "bfloat16" -> RTX30 系列+，更稳定
#
# 示例：
# amp_dtype: "float16"
# amp_dtype: "bfloat16"
#
amp_dtype: "float16"



###############################################################################
# 数据加载
###############################################################################

# 数据加载线程数
#
# 说明：并行读取数据的进程数
#
# 建议值：CPU 核心数的一半
#
# 示例：
# workers: 8        # 16 核 CPU
# workers: 4        # 8 核 CPU
# workers: 2        # 显存紧张时降低
#
workers: 8



# PIN 内存
#
# 说明：将数据锁定在内存，加速 GPU 传输
#
# true  -> 启用（推荐，有 CUDA）
# false -> 禁用（CPU 训练或显存有限）
#
# 示例：
# pin_mem: true
#
pin_mem: true



###############################################################################
# 输出和实验配置
###############################################################################

# 输出目录
#
# 说明：保存模型、日志、checkpoint 的根目录
#
# 示例：
# output: "./output"
# output: "/path/to/save"
#
output: "./output"



# 实验名称
#
# 说明：在 output 目录下生成的子文件夹名
#
# 会生成：output/exp1/
#
# 示例：
# experiment: "exp1"
# experiment: "resnet50_bs128_lr01"
#
experiment: "exp1"



###############################################################################
# EMA（指数移动平均）- 强烈推荐
###############################################################################

# 启用 EMA
#
# 说明：跟踪模型权重的移动平均版本用于验证
#
# 好处：
# - 能提高最终精度 1-2%
# - ImageNet 基本都用
#
# true  -> 启用（推荐）
# false -> 不用
#
# 示例：
# model_ema: true
#
model_ema: false



# EMA 衰减系数
#
# 说明：EMA 权重更新的衰减速度
# 越大越平滑，变化越慢
#
# 常见值：
# 0.9998 -> ImageNet 标准（推荐）
# 0.9999 -> 更平滑但更新更慢
# 0.999  -> 更快适应
#
# 示例：
# model_ema_decay: 0.9998
#
model_ema_decay: 0.9998



###############################################################################
# 随机种子
###############################################################################

# 随机种子
#
# 说明：控制随机性，保证可复现性
#
# 示例：
# seed: 42
#
seed: 42



################################################################################
#
# 第二部分：高级参数（非常见，按需调整）
#
################################################################################



###############################################################################
# 输入尺寸高级设置
###############################################################################

# 输入张量大小
#
# 说明：明确指定输入大小 [C, H, W]
# 通常留空让 timm 自动推断
#
# 示例：
# input_size: null
# input_size: [3, 224, 224]
#
input_size: null



# 输入通道数
#
# 说明：RGB=3, 灰度图=1
# null 时自动推断
#
# 示例：
# in_chans: null
# in_chans: 3
#
in_chans: null



# 验证集中心裁剪比例
#
# 说明：验证时从原图裁剪的比例
#
# null   -> 自动（推荐）
# 0.875  -> ImageNet 标准
#
# 示例：
# crop_pct: null
# crop_pct: 0.875
#
crop_pct: null



# 图像均值和标准差
#
# 说明：数据归一化参数
# null 时自动使用 ImageNet 默认值
#
# ImageNet 默认：
# mean: [0.485, 0.456, 0.406]
# std:  [0.229, 0.224, 0.225]
#
# 示例：
# mean: null
# mean: [0.485, 0.456, 0.406]
#
mean: null
std: null



###############################################################################
# 梯度相关
###############################################################################

# 梯度累积步数
#
# 说明：累积多少步的梯度后再更新一次参数
# 显存不足时非常有用
#
# 等效关系：
# batch_size *= grad_accum_steps
#
# 示例：
# grad_accum_steps: 1       # 每步都更新
# grad_accum_steps: 4       # batch_size=32 -> 等效 128
#
grad_accum_steps: 1



# 梯度裁剪
#
# 说明：限制梯度的最大范数，防止梯度爆炸
#
# Transformer 常用
# CNN 通常不用（null）
#
# 常见值：
# null -> 不用（CNN）
# 1.0  -> ViT 标准
#
# 示例：
# clip_grad: null
# clip_grad: 1.0
#
clip_grad: null



# 梯度裁剪模式
#
# 说明：梯度裁剪的方式
#
# "norm"  -> 按范数裁剪（标准）
# "value" -> 按值裁剪
# "agc"   -> 自适应梯度裁剪
#
# 示例：
# clip_mode: "norm"
#
clip_mode: "norm"



###############################################################################
# Batch Norm 参数
###############################################################################

# 同步 Batch Norm
#
# 说明：多卡训练时同步 BN 统计量
#
# false -> 单卡或不同步（默认）
# true  -> 多卡同步（推荐多卡）
#
# 示例：
# sync_bn: false
# sync_bn: true
#
sync_bn: false



# Batch Norm Momentum
#
# 说明：BN 运行统计的动量
# null 时使用默认值
#
# 通常不需要修改
#
# 示例：
# bn_momentum: null
#
bn_momentum: null



# Batch Norm Epsilon
#
# 说明：BN 分母的小数，防止除以零
# null 时使用默认值
#
# 通常不需要修改
#
# 示例：
# bn_eps: null
#
bn_eps: null



###############################################################################
# 数据增强高级参数
###############################################################################

# 随机缩放范围
#
# 说明：Random Resized Crop 的缩放比例
#
# 示例：
# scale: [0.08, 1.0]
#
scale: [0.08, 1.0]



# 随机宽高比范围
#
# 说明：Random Resized Crop 的宽高比范围
#
# 示例：
# ratio: [0.75, 1.3333333333]
#
ratio: [0.75, 1.3333333333]



# 水平翻转概率
#
# 说明：左右翻转的概率
#
# 常见值：
# 0.5 -> 标准
#
# 示例：
# hflip: 0.5
#
hflip: 0.5



# 垂直翻转概率
#
# 说明：上下翻转的概率
# 通常不用（0.0）
#
# 示例：
# vflip: 0.0
#
vflip: 0.0



# 颜色抖动
#
# 说明：随机改变亮度、对比度等
#
# 常见值：
# 0.4 -> ImageNet 标准
#
# 示例：
# color_jitter: 0.4
#
color_jitter: 0.4



# 灰度化概率
#
# 说明：随机转为灰度图
#
# 示例：
# grayscale_prob: null
#
grayscale_prob: null



# 高斯模糊概率
#
# 说明：随机应用高斯模糊
#
# 示例：
# gaussian_blur_prob: null
#
gaussian_blur_prob: null



###############################################################################
# Mixup/CutMix 高级参数
###############################################################################

# Mixup/CutMix 应用概率
#
# 说明：实际应用 Mixup 或 CutMix 的概率
#
# 1.0 -> 每次都用（推荐）
#
# 示例：
# mixup_prob: 1.0
#
mixup_prob: 1.0



# Mixup/CutMix 切换概率
#
# 说明：在 Mixup 和 CutMix 间切换的概率
# 同时启用两种时有效
#
# 0.5 -> 50% 用 Mixup，50% 用 CutMix
#
# 示例：
# mixup_switch_prob: 0.5
#
mixup_switch_prob: 0.5



# Mixup 应用模式
#
# 说明：如何应用 Mixup
#
# "batch" -> 同批内混合（标准）
# "pair"  -> 成对混合
# "elem"  -> 元素级混合
#
# 示例：
# mixup_mode: "batch"
#
mixup_mode: "batch"



# 关闭 Mixup 的轮数
#
# 说明：从第几个 epoch 开始停用 Mixup
# 0 表示从不关闭
#
# 示例：
# mixup_off_epoch: 0
#
mixup_off_epoch: 0



# CutMix 最小最大比例
#
# 说明：覆盖区域的最小最大面积比例
#
# 示例：
# cutmix_minmax: null
#
cutmix_minmax: null



###############################################################################
# Random Erasing 高级参数
###############################################################################

# 随机擦除模式
#
# 说明：擦除的内容
#
# "pixel" -> 随机像素值（推荐）
# "const" -> 常数值
#
# 示例：
# remode: "pixel"
#
remode: "pixel"



# 擦除次数
#
# 说明：每张图擦除几个区域
#
# 1 -> 擦除一个区域（推荐）
#
# 示例：
# recount: 1
#
recount: 1



# 分割擦除
#
# 说明：是否在数据增强分割后擦除
#
# false -> 对所有分割应用
# true  -> 仅对非原始分割应用
#
# 示例：
# resplit: false
#
resplit: false



###############################################################################
# 学习率调度器高级参数
###############################################################################

# 基础学习率
#
# 说明：用于计算实际学习率的基础值
# 公式：lr = lr_base * (batch_size / lr_base_size)
#
# 0.1 -> SGD 标准
#
# 示例：
# lr_base: 0.1
#
lr_base: 0.1



# 基础学习率的 batch size
#
# 说明：基础学习率对应的 batch size
#
# 256 -> ImageNet 标准
#
# 示例：
# lr_base_size: 256
#
lr_base_size: 256



# 学习率缩放方式
#
# 说明：如何根据 batch size 缩放学习率
#
# ""       -> 自动决定（推荐）
# "linear" -> 线性缩放：lr = lr_base * (bs / base_bs)
# "sqrt"   -> 平方根缩放：lr = lr_base * sqrt(bs / base_bs)
#
# 示例：
# lr_base_scale: ""
#
lr_base_scale: ""



# 学习率噪声
#
# 说明：在某些 epoch 百分比范围添加噪声到学习率
#
# 示例：
# lr_noise: null
#
lr_noise: null



# 学习率噪声百分比
#
# 说明：噪声的标准差百分比
#
# 0.67 -> 67%（推荐）
#
# 示例：
# lr_noise_pct: 0.67
#
lr_noise_pct: 0.67



# 学习率噪声标准差
#
# 说明：噪声标准差倍数
#
# 1.0 -> 标准（推荐）
#
# 示例：
# lr_noise_std: 1.0
#
lr_noise_std: 1.0



# 学习率循环倍数
#
# 说明：每次循环时长的倍增因子
#
# 1.0 -> 不倍增（推荐）
#
# 示例：
# lr_cycle_mul: 1.0
#
lr_cycle_mul: 1.0



# 学习率循环衰减
#
# 说明：每次循环时学习率衰减多少
#
# 0.5 -> 衰减到一半（推荐）
#
# 示例：
# lr_cycle_decay: 0.5
#
lr_cycle_decay: 0.5



# 学习率循环限制
#
# 说明：最多循环多少次
# > 1 时启用循环
#
# 1 -> 不循环（推荐）
#
# 示例：
# lr_cycle_limit: 1
#
lr_cycle_limit: 1



# 学习率 k 衰减
#
# 说明：cosine 和 poly scheduler 的 k 衰减因子
#
# 1.0 -> 标准 cosine（推荐）
#
# 示例：
# lr_k_decay: 1.0
#
lr_k_decay: 1.0



###############################################################################
# Step/Multistep Scheduler
###############################################################################

# 衰减周期（Step Scheduler）
#
# 说明：每多少个 epoch 衰减一次学习率
#
# 90 -> 每 90 个 epoch 衰减（推荐）
#
# 示例：
# decay_epochs: 90
#
decay_epochs: 90



# 衰减位置（Multistep Scheduler）
#
# 说明：在哪些 epoch 处衰减学习率
#
# 300 epoch 时推荐：
# [100, 200] 或 [90, 180, 270]
#
# 示例：
# decay_milestones: [90, 180, 270]
#
decay_milestones: [90, 180, 270]



# 衰减比例
#
# 说明：每次衰减时学习率乘以多少
#
# 0.1 -> 衰减到 1/10（推荐）
#
# 示例：
# decay_rate: 0.1
#
decay_rate: 0.1



###############################################################################
# Checkpoint 和恢复
###############################################################################

# 保存 Checkpoint 数量
#
# 说明：保留最好的多少个模型
#
# 10 -> 保留前 10 个最优模型（推荐）
#
# 示例：
# checkpoint_hist: 10
#
checkpoint_hist: 10



# 验证间隔
#
# 说明：每多少个 epoch 进行一次验证和保存
#
# 1   -> 每个 epoch 都验证（推荐）
# 5   -> 每 5 个 epoch 验证一次（加快训练）
#
# 示例：
# val_interval: 1
#
val_interval: 1



# 恢复点保存间隔
#
# 说明：每多少个 batch 保存一个恢复点
# 0 表示不保存恢复点
#
# 示例：
# recovery_interval: 0
#
recovery_interval: 0



# 日志输出频率
#
# 说明：每多少个 batch 输出一次日志
#
# 50 -> 每 50 个 batch 输出一次（推荐）
#
# 示例：
# log_interval: 50
#
log_interval: 50



# 恢复训练
#
# 说明：从某个 checkpoint 恢复训练
# 会恢复模型、优化器、学习率调度器状态
#
# ""（空） -> 不恢复，从头开始
# 某个 .pth 路径 -> 恢复
#
# 示例：
# resume: ""
# resume: "./output/exp1/checkpoint-10.pth.tar"
#
resume: ""



# 是否恢复优化器状态
#
# 说明：resume 时是否恢复优化器
#
# false -> 恢复优化器（推荐）
# true  -> 不恢复优化器（需要重新调整学习率）
#
# 示例：
# no_resume_opt: false
#
no_resume_opt: false



###############################################################################
# 内存和计算优化
###############################################################################

# Channels Last 内存格式
#
# 说明：使用 NHWC 而非 NCHW 内存排列
# NVIDIA GPU 有时会更快
#
# false -> NCHW（标准）
# true  -> NHWC（尝试提速）
#
# 示例：
# channels_last: false
#
channels_last: false



# 禁用预取器
#
# 说明：禁用快速数据预取
# 调试时使用
#
# false -> 启用预取（推荐）
# true  -> 禁用
#
# 示例：
# no_prefetcher: false
#
no_prefetcher: false



# 多 Epoch Loader
#
# 说明：使用多轮 epoch loader，加快数据加载
#
# false -> 标准模式（推荐）
# true  -> 多轮模式
#
# 示例：
# use_multi_epochs_loader: false
#
use_multi_epochs_loader: false



###############################################################################
# 测试增强（TTA）
###############################################################################

# 测试增强倍数
#
# 说明：推理时使用 TTA，过采样多个 crop
# 会显著降低推理速度但可能提高精度
#
# 0 -> 不用（推荐训练）
# 4 -> 4 倍增强（更慢但更准）
#
# 示例：
# tta: 0
#
tta: 0



###############################################################################
# 评估指标
###############################################################################

# 评估指标
#
# 说明：用于模型选择的指标
#
# "top1"  -> Top-1 准确率（推荐）
# "loss"  -> 验证损失
#
# 示例：
# eval_metric: "top1"
#
eval_metric: "top1"



###############################################################################
# TorchScript 编译
###############################################################################

# TorchScript
#
# 说明：使用 torch.jit.script 编译模型
#
# false -> 不编译（推荐）
# true  -> 编译（可能导致不兼容）
#
# 示例：
# torchscript: false
#
torchscript: false



# TorchCompile
#
# 说明：使用 PyTorch 2.0 的 torch.compile 加速
#
# null -> 不编译（推荐）
# "inductor" -> 使用 inductor 后端
#
# 示例：
# torchcompile: null
#
torchcompile: null



###############################################################################
# 分布式训练
###############################################################################

# 本地排名
#
# 说明：DDP 中当前进程的本地排名
# 通常由 torchrun 自动设置，不需要手动修改
#
# 示例：
# local_rank: 0
#
local_rank: 0



# 禁用 DDP 广播缓冲
#
# 说明：禁用 DDP 的缓冲广播
#
# false -> 启用广播（推荐）
# true  -> 禁用（某些情况下）
#
# 示例：
# no_ddp_bb: false
#
no_ddp_bb: false



###############################################################################
# Wandb 日志（可选）
###############################################################################

# 启用 Wandb 日志
#
# 说明：是否将训练指标上传到 Weights & Biases
#
# false -> 不用（推荐本地训练）
# true  -> 启用（需要先 pip install wandb）
#
# 示例：
# log_wandb: false
#
log_wandb: false



# Wandb 项目名称
#
# 说明：Wandb 项目名称
#
# 示例：
# wandb_project: null
# wandb_project: "my-imagenet-project"
#
wandb_project: null



# Wandb 标签
#
# 说明：为 Wandb run 添加标签
#
# 示例：
# wandb_tags: []
# wandb_tags: ["baseline", "resnet50"]
#
wandb_tags: []



# Wandb 恢复 ID
#
# 说明：恢复某个已有的 Wandb run
#
# 示例：
# wandb_resume_id: ""
#
wandb_resume_id: ""



###############################################################################
# 设备相关
###############################################################################

# 计算设备
#
# 说明：训练使用的设备
#
# "cuda" -> GPU（推荐）
# "cpu"  -> CPU（很慢）
#
# 示例：
# device: "cuda"
#
device: "cuda"



# 设备模块
#
# 说明：设备后端的 Python 模块，用于特殊硬件
# 通常不需要修改
#
# 示例：
# device_modules: null
#
device_modules: null



# 模型数据类型
#
# 说明：模型权重的数据类型（非 AMP）
# AMP 打开时不能使用
#
# null      -> float32（推荐）
# "float32" -> 32 位浮点
# "float16" -> 16 位浮点（不推荐，不稳定）
#
# 示例：
# model_dtype: null
#
model_dtype: null



###############################################################################
# 梯度检查点
###############################################################################

# 梯度检查点
#
# 说明：启用梯度检查点以节省显存
# 会增加计算量但减少显存使用
#
# false -> 不启用（推荐）
# true  -> 启用（显存紧张时）
#
# 示例：
# grad_checkpointing: false
#
# 注：该参数在命令行中为 --grad-checkpointing，
# 配置文件中暂不支持，请在命令行中启用
#
grad_checkpointing: false



###############################################################################
# EMA 高级参数
###############################################################################

# EMA 强制使用 CPU
#
# 说明：将 EMA 模型放在 CPU 上
# 节省显存但推理变慢
#
# false -> GPU（推荐）
# true  -> CPU
#
# 示例：
# model_ema_force_cpu: false
#
model_ema_force_cpu: false



# EMA 预热
#
# 说明：EMA 前几个 epoch 使用较低的衰减系数
#
# false -> 不预热（推荐）
# true  -> 预热
#
# 示例：
# model_ema_warmup: false
#
model_ema_warmup: false



###############################################################################
# 知识蒸馏（可选）
###############################################################################

# 教师模型名称
#
# 说明：用于知识蒸馏的教师模型
# 留空表示不使用蒸馏，只做普通分类
#
# 示例：
# kd_model_name: null
# kd_model_name: "vit_large_patch16_224"
#
kd_model_name: null



# 蒸馏类型
#
# 说明：蒸馏方式
#
# "logit"   -> 输出层蒸馏（最常用）
# "feature" -> 中间特征蒸馏（更复杂）
# "token"   -> token 级蒸馏（ViT 专用）
#
# 示例：
# kd_distill_type: "logit"
#
kd_distill_type: "logit"



# KL 温度
#
# 说明：蒸馏的温度参数，控制软标签平滑度
# 越高越平滑
#
# 常见值：
# 4.0 -> ImageNet 推荐
# 3.0 -> 更硬的目标
# 5.0 -> 更软的目标
#
# 示例：
# kd_temperature: 4.0
#
kd_temperature: 4.0



# 蒸馏 Loss 权重
#
# 说明：蒸馏 loss 的权重
# null 时为 1.0
#
# 示例：
# distill_loss_weight: null
#
distill_loss_weight: null



# 任务 Loss 权重
#
# 说明：分类任务 loss 的权重
# null 时为 1.0
#
# 示例：
# task_loss_weight: null
#
task_loss_weight: null



###############################################################################
# NaFlex（高级功能，用于变分辨率训练）
###############################################################################

# 启用 NaFlex Loader
#
# 说明：使用 NaFlex 加载器进行变分辨率/变宽高比训练
# 仅适用于 NaFlexViT 等支持的模型
#
# false -> 标准 loader（推荐）
# true  -> NaFlex loader
#
# 示例：
# naflex_loader: false
#
naflex_loader: false



# NaFlex 训练序列长度
#
# 说明：训练时随机采样的序列长度列表
#
# 示例：
# naflex_train_seq_lens: [128, 256, 576, 784, 1024]
#
naflex_train_seq_lens: [128, 256, 576, 784, 1024]



# NaFlex 最大序列长度
#
# 说明：验证时使用的固定序列长度
#
# 示例：
# naflex_max_seq_len: 576
#
naflex_max_seq_len: 576



# NaFlex Patch 大小列表
#
# 说明：支持的 Patch 大小列表（变 Patch 大小训练）
#
# 示例：
# naflex_patch_sizes: null
# naflex_patch_sizes: [8, 12, 16, 24, 32]
#
naflex_patch_sizes: null



# NaFlex Patch 大小概率
#
# 说明：每个 Patch 大小的采样概率
# 长度必须等于 naflex_patch_sizes 长度
#
# 示例：
# naflex_patch_size_probs: null
#
naflex_patch_size_probs: null



# NaFlex Loss 缩放方式
#
# 说明：如何根据序列长度缩放 loss
#
# "linear" -> 线性缩放（推荐）
# "sqrt"   -> 平方根缩放
# "none"   -> 不缩放
#
# 示例：
# naflex_loss_scale: "linear"
#
naflex_loss_scale: "linear"



# NaFlex Patchify 通道顺序
#
# 说明：Patch 化时的通道顺序
#
# false -> 通道后（C-P-P，推荐）
# true  -> 通道前（P-P-C）
#
# 示例：
# naflex_patchify_channels_first: false
#
naflex_patchify_channels_first: false